# Local Postgres for Petsit backend development.
# From repo root: docker compose up -d

services:
  db:
    image: postgres:16-alpine
    container_name: petsit-db
    restart: no
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: petsit
    ports:
      - "5432:5432"
    volumes:
      - petsit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d petsit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  petsit_pg_data:
